name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  integration:
    # The reporter binds to Playwright's reporter API (onStepBegin, step.parent,
    # result.stdout), so package.json promises `@playwright/test >=1.40.0`. This
    # matrix is what keeps that promise honest: the floor of the supported range,
    # a recent stable, and whatever `latest` currently resolves to.
    name: Integration (Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.40.0', '1.49.1', 'latest']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned at the root, not inside test-project: the built reporter resolves
      # @playwright/test from the root tree, and a second copy under
      # test-project/node_modules makes Playwright throw
      # "Requiring @playwright/test second time".
      - name: Pin @playwright/test to ${{ matrix.playwright }}
        run: npm install --no-save "@playwright/test@${{ matrix.playwright }}"

      - name: Report resolved Playwright version
        run: npx playwright --version

      # System dependencies come from a current Playwright, because the pinned
      # version may predate the runner image. 1.40.0 (Nov 2023) asks noble for
      # libasound2, which Ubuntu 24.04 renamed to libasound2t64:
      #   E: Package 'libasound2' has no installation candidate
      # The browser binary itself is then installed by the pinned version, which
      # is the copy the tests actually run against.
      - name: Install system dependencies
        run: npx --yes playwright@latest install-deps chromium

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run integration tests
        run: npx playwright test --config test-project/playwright.config.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-playwright-${{ matrix.playwright }}
          path: test-project/test-results/
          retention-days: 7
